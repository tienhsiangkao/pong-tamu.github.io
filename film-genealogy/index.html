<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Genealogy of Film — 1895–1930</title>
<style>
:root{--bg:#0b0b0b;--p:#131313;--t:#f2efe8;--m:#a49f97;--l:#302e2a;--a:#e6d8ae}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{color:inherit}.app{max-width:1500px;margin:auto;padding:22px}.top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:1px solid var(--l);padding-bottom:22px}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--m);font-weight:800}h1{font:500 clamp(42px,7vw,84px)/.9 Georgia,serif;letter-spacing:-.045em;margin:8px 0}.deck{color:var(--m);max-width:820px}.tools{display:flex;gap:8px;flex-wrap:wrap}.search,.chip{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:999px;padding:10px 13px}.search{width:240px}.chip{cursor:pointer}.chip.on{background:var(--a);color:#111}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start;padding-top:22px}.timeline{border-left:1px solid var(--l)}.era{display:grid;grid-template-columns:78px minmax(0,1fr);border-top:1px solid var(--l)}.era:first-child{border-top:0}.year{padding:26px 12px 0 0;text-align:right;font-size:11px;font-weight:900;color:var(--m)}.eb{padding:22px 0 28px 22px}.eh{display:flex;gap:10px;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--m);font-weight:800;margin-bottom:13px}.eh:after{content:"";height:1px;background:var(--l);flex:1}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid var(--l);border-radius:15px;overflow:hidden;background:var(--p);padding:0;text-align:left;cursor:pointer}.card.sel{outline:2px solid var(--a);outline-offset:2px}.pic{aspect-ratio:4/5;background:#1c1c1c;overflow:hidden}.pic img{width:100%;height:100%;display:block;object-fit:cover;filter:grayscale(1) contrast(1.05)}.cb{padding:12px}.meta{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--m);font-weight:800}.name{font:500 23px/1.04 Georgia,serif;margin:5px 0}.role{font-size:12px;color:var(--m)}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.tag{font-size:9px;border:1px solid var(--l);border-radius:999px;padding:3px 7px;color:#c3beb6}.movement{min-height:230px;display:flex;flex-direction:column;justify-content:center;border-style:dashed}.detail{position:sticky;top:18px;background:var(--p);border:1px solid var(--l);border-radius:18px;overflow:hidden}.hero{display:none;aspect-ratio:16/10;background:#1d1d1d}.hero.show{display:block}.hero img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}.db{padding:18px}.detail h2{font:500 34px/1 Georgia,serif;margin:5px 0 8px}.detail p{font-size:13px;color:var(--m)}.sec{border-top:1px solid var(--l);margin-top:15px;padding-top:13px}.conn{width:100%;text-align:left;border:1px solid var(--l);background:#0e0e0e;border-radius:11px;padding:10px;margin-top:8px;cursor:pointer}.conn small{display:block;color:var(--m);margin-top:3px}.path{display:none;margin-top:18px;border:1px solid var(--l);background:var(--p);border-radius:13px;padding:11px}.path.show{display:block}.hidden{display:none!important}.credit{font-size:9px;color:#777;margin-top:10px}a{color:var(--a)}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.detail{position:relative}.cards{grid-template-columns:repeat(2,1fr)}.top{grid-template-columns:1fr}}
@media(max-width:650px){.app{padding:14px}.cards{grid-template-columns:1fr}.era{grid-template-columns:52px 1fr}.eb{padding-left:12px}.year{padding-right:6px}.search{width:100%}.pic{aspect-ratio:5/4}}
</style></head><body><div class="app">
<header class="top"><div><div class="ey">Interactive cinema genealogy · Chapter I</div><h1>The Genealogy<br>of Film</h1><div class="deck">1895–1930. A portrait-led map of how cinematic ideas travel: what was inherited, transformed, rejected, or recombined.</div></div><div class="tools"><input id="q" class="search" placeholder="Search a filmmaker…"><button class="chip on" data-f="all">All</button><button class="chip" data-f="reality">Reality</button><button class="chip" data-f="narrative">Narrative</button><button class="chip" data-f="formal">Form</button></div></header>
<div id="path" class="path"></div><div class="layout"><main id="timeline" class="timeline"></main><aside class="detail"><div id="hero" class="hero"><img id="heroImg" alt=""></div><div class="db"><div id="dm" class="ey"></div><h2 id="dn"></h2><p id="ds"></p><div class="sec"><div class="ey">Contribution</div><p id="dc"></p></div><div class="sec"><div class="ey">Key works</div><div id="df" class="tags"></div></div><div class="sec"><div class="ey">Connections</div><div id="dl"></div></div><div class="sec"><div class="ey">Why it matters later</div><p id="dg"></p><div id="cr" class="credit"></div></div></div></aside></div></div>
<script>
(()=>{const C=f=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width=700',P=f=>'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(f);
const N={
lumiere:['Lumière Brothers','1895','reality','Filmmakers','Actuality · framing · duration','Cinema as observation: framing real movement in real time. Our chosen root, not a claim that cinema had only one inventor.','Actuality, fixed viewpoint, everyday movement, spatial observation.',['Workers Leaving the Factory','Arrival of a Train'],'Feeds documentary, realism, city films and observational cinema.','Lumière_brothers.jpg'],
melies:['Georges Méliès','1896+','formal','Filmmaker','Trick film · fantasy · spectacle','Cinema as fabrication rather than merely recording what stands before the camera.','Substitution tricks, theatrical staging, fantasy and constructed screen space.',['The Vanishing Lady','A Trip to the Moon'],'Feeds effects cinema, fantasy and science fiction.','Méliès_portrait.png'],
guy:['Alice Guy-Blaché','1897+','narrative','Filmmaker','Scripted fiction · production','An early shift toward authored, staged narrative cinema and studio leadership.','Scripted scenes, narrative authorship and production organization.',['La Fée aux Choux','Falling Leaves'],'Her professional lineage reaches Lois Weber and Gaumont-era production.','Alice_Guy.jpg'],
actuality:['Actuality cinema','1890s+','reality','Tradition','Events · travel · labour','Before documentary became a genre, actuality films recorded public life, labour, travel and events.','Non-fiction impulse, location shooting and everyday observation.',['Early actualités'],'Develops toward documentary, newsreel, city symphony and observational film.',null],
porter:['Edwin S. Porter','1903+','narrative','Filmmaker','Multi-shot narrative','A transitional figure between attraction-based cinema and coherent multi-shot storytelling.','Temporal linkage and action organized across cuts.',['Life of an American Fireman','The Great Train Robbery'],'Sets the stage for more systematic continuity.','Edwin S Porter.jpg'],
feuillade:['Louis Feuillade','1906+','narrative','Filmmaker','Serial · realism + fantasy','Recognisable streets and rooms become infected by masks, conspiracies and criminal fantasy.','Serial form, location realism, suspense and recurring characters.',['Fantômas','Les Vampires'],'Anticipates crime serials and location-based genre filmmaking.','Louis Feuillade.jpg'],
griffith:['D. W. Griffith','1908+','narrative','Filmmaker','Cross-cutting · continuity','A central node in the systematization of narrative film grammar, with a legacy inseparable from the racist politics of The Birth of a Nation.','Cross-cutting, close-up, rhythmic escalation and spatial continuity.',['Intolerance','Broken Blossoms'],'Becomes a reference point for classical narrative and Soviet montage theory.','GriffithDW.jpg'],
weber:['Lois Weber','1911+','reality','Filmmaker','Social drama · moral conflict','Narrative technique used for social argument, domestic space and ethical tension.','Social realism, split-screen experimentation and domestic space.',['Suspense','Shoes','The Blot'],'Shows early film grammar developing across multiple authors and social purposes.','LoisWeber.jpg'],
chaplin:['Charlie Chaplin','1914+','narrative','Filmmaker','Performance · timing · pathos','Performance becomes a complete cinematic system: the body determines rhythm, framing and emotion.','Gesture, comic timing, visual storytelling and pathos.',['The Immigrant','The Kid'],'A major ancestor of performance-centered visual storytelling.','Charlie Chaplin portrait.jpg'],
keaton:['Buster Keaton','1920s','formal','Filmmaker','Architecture · mechanics','Character collides with an indifferent mechanical world; spatial precision becomes comedy.','Long-shot staging, architecture and physical causality.',['Sherlock Jr.','The General'],'Feeds filmmakers obsessed with geometry and practical action.','Buster Keaton portrait.jpg'],
expressionism:['German Expressionism','1920s','formal','Movement','Light · distortion · subjective space','Sets, shadows and geometry become extensions of psychology.','High-contrast lighting, distorted sets and subjective architecture.',['The Cabinet of Dr. Caligari'],'Runs through horror, noir, Hitchcock and stylized thrillers.',null],
kuleshov:['Lev Kuleshov','1920s','formal','Filmmaker / theorist','Meaning between shots','Meaning can be produced through the relation between shots, not just within a shot.','Associative editing, constructed geography and montage theory.',['Kuleshov workshop experiments'],'The cut becomes an engine of meaning.','Lev Kuleshov (1917) (cropped).jpg'],
lang:['Fritz Lang','1921+','formal','Filmmaker','Geometry · systems','Expressionist design becomes a machine for thinking about crime, cities and technology.','Geometric staging, monumental architecture and system thinking.',['Dr. Mabuse','Metropolis'],'A bridge toward Hitchcock, noir and science fiction.','Fritz Lang (1969).jpg'],
murnau:['F. W. Murnau','1922+','formal','Filmmaker','Mobile camera · atmosphere','Expressionist psychology expands into fluid camera movement and spatial narration.','Mobile camera, atmospheric framing and expressive mise-en-scène.',['Nosferatu','The Last Laugh','Sunrise'],'A key ancestor for directors who treat the camera as a performer.','Friedrich Wilhelm Murnau.jpg'],
vertov:['Dziga Vertov','1924+','reality','Filmmaker','Kino-eye · nonfiction montage','Reality is not merely captured; camera and montage actively reorganize perception.','Kino-eye, reflexivity, city symphony form and documentary montage.',['Kino-Eye','Man with a Movie Camera'],'Feeds documentary modernism and essay film.','David Kaufman (Dziga Vertov) 1913.jpg'],
eisenstein:['Sergei Eisenstein','1925+','formal','Filmmaker / theorist','Collision montage','One shot collides with another to generate emotion, rhythm and argument.','Metric, rhythmic, tonal and intellectual montage.',['Strike','Battleship Potemkin','October'],'His editing theory travels through political cinema, advertising and action montage.','Sergei Eisenstein 03.jpg'],
hitchcock:['Alfred Hitchcock','1926+','narrative','Filmmaker','POV · suspense · subjectivity','Narrative continuity, German visual design and subjectivity converge into controlled suspense.','POV, restricted information, suspense architecture and subjective montage.',['The Lodger','Blackmail'],'Later branches include Truffaut, De Palma, Spielberg and Fincher.','Alfred Hitchcock 1925 Portrait.jpg'],
dreyer:['Carl T. Dreyer','1928','formal','Filmmaker','Close-up · abstraction · duration','Cinema turns toward radical facial concentration, stripped spatial logic and spiritual intensity.','Radical close-up, abstract space, duration and minimal gesture.',['The Passion of Joan of Arc'],'Feeds Bresson, Bergman and later austere art cinema.','Carl Theodor Dreyer (1965) by Erling Mandelmann.jpg'],
sound:['Sound-era threshold','c. 1930','narrative','Threshold','Dialogue · music · acoustic space','Synchronized sound changes performance, staging, cutting and production—but silent-era visual languages survive.','Dialogue, synchronized music, acoustic space and new acting rhythms.',['→ Chapter II'],'The next chapter follows these languages into the sound era.',null]};
const E=[['lumiere','melies','documented','Projected actuality toward cinematic illusion.'],['lumiere','actuality','lineage','Cinema as record and observation.'],['lumiere','feuillade','lineage','Location realism survives inside serial fantasy.'],['melies','porter','documented','Trick-film construction enters Porter’s inheritance.'],['guy','feuillade','documented','Professional Gaumont succession.'],['guy','weber','documented','Mentorship and professional lineage.'],['porter','griffith','documented','Multi-shot storytelling precedes systematic editing grammar.'],['griffith','kuleshov','documented','Soviet filmmakers study Griffith’s editing.'],['griffith','eisenstein','documented','Eisenstein directly engages with Griffith.'],['kuleshov','eisenstein','documented','Pedagogical and theoretical lineage.'],['actuality','vertov','lineage','Non-fiction observation becomes a theory of perception.'],['expressionism','lang','lineage','Expressionist space expands into geometric systems.'],['expressionism','murnau','lineage','Expressionist psychology combines with mobile narration.'],['expressionism','hitchcock','lineage','German visual strategies enter Hitchcock’s suspense vocabulary.'],['lang','hitchcock','documented','Formative exposure to German production and Lang.']];
const eras=[['1895','The camera discovers the world',['lumiere','melies']],['1897','Fiction and actuality diverge',['guy','actuality']],['1903–11','Shots become grammar',['porter','feuillade','griffith','weber']],['1914–20','Performance and space become systems',['chaplin','keaton']],['1920','Cinema becomes psychological and theoretical',['expressionism','kuleshov']],['1921–24','Space, reality and the camera split again',['lang','murnau','vertov']],['1925–28','Silent cinema reaches formal extremity',['eisenstein','hitchcock','dreyer']],['1930','Threshold',['sound']]];
const T=document.getElementById('timeline'),Q=document.getElementById('q'),path=document.getElementById('path');let F='all';
const fb=n=>{const i=n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('');return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750"><rect width="100%" height="100%" fill="#1b1b1b"/><text x="50%" y="51%" dominant-baseline="middle" text-anchor="middle" font-family="Georgia" font-size="150" fill="#777">'+i+'</text></svg>')};
function card(id){let n=N[id];return '<button class="card '+(!n[9]?'movement':'')+'" data-id="'+id+'" data-cat="'+n[2]+'">'+(n[9]?'<div class="pic"><img loading="lazy" alt="Portrait of '+n[0]+'" src="'+C(n[9])+'"></div>':'')+'<div class="cb"><div class="meta">'+n[3]+' · '+n[1]+'</div><div class="name">'+n[0]+'</div><div class="role">'+n[4]+'</div><div class="tags">'+n[7].slice(0,2).map(x=>'<span class="tag">'+x+'</span>').join('')+'</div></div></button>'}
function render(){T.innerHTML=eras.map(e=>'<section class="era"><div class="year">'+e[0]+'</div><div class="eb"><div class="eh">'+e[1]+'</div><div class="cards">'+e[2].map(card).join('')+'</div></div></section>').join('');T.querySelectorAll('.card').forEach(b=>b.onclick=()=>select(b.dataset.id));T.querySelectorAll('.pic img').forEach(img=>img.onerror=()=>{img.onerror=null;img.src=fb(img.alt.replace('Portrait of ',''))});vis()}
function links(id){return E.filter(e=>e[0]===id||e[1]===id)}
function select(id){let n=N[id];T.querySelectorAll('.card').forEach(x=>x.classList.toggle('sel',x.dataset.id===id));dm.textContent=n[3]+' · '+n[1];dn.textContent=n[0];ds.textContent=n[5];dc.textContent=n[6];df.innerHTML=n[7].map(x=>'<span class="tag">'+x+'</span>').join('');dg.textContent=n[8];if(n[9]){hero.classList.add('show');heroImg.src=C(n[9]);heroImg.alt='Portrait of '+n[0];heroImg.onerror=()=>{heroImg.onerror=null;heroImg.src=fb(n[0])};cr.innerHTML='Portrait source: <a target="_blank" rel="noopener" href="'+P(n[9])+'">Wikimedia Commons</a>. See source page for license.'}else{hero.classList.remove('show');cr.textContent=''}let L=links(id);dl.innerHTML=L.length?L.map(e=>{let o=e[0]===id?e[1]:e[0],a=e[0]===id?'→':'←';return '<button class="conn" data-i="'+E.indexOf(e)+'"><strong>'+n[0]+' '+a+' '+N[o][0]+'</strong><small>'+(e[2]==='documented'?'Documented':'Historical / formal lineage')+' · '+e[3]+'</small></button>'}).join(''):'<p>No promoted connections yet.</p>';dl.querySelectorAll('.conn').forEach(b=>b.onclick=()=>focus(+b.dataset.i))}
function focus(i){let e=E[i];path.classList.add('show');path.innerHTML='<div class="ey">Focused lineage</div><strong>'+N[e[0]][0]+'</strong> → <strong>'+N[e[1]][0]+'</strong> · '+e[3];T.querySelectorAll('.card').forEach(c=>c.style.opacity=(c.dataset.id===e[0]||c.dataset.id===e[1])?'1':'.23')}
function vis(){let q=Q.value.trim().toLowerCase();T.querySelectorAll('.card').forEach(c=>{let n=N[c.dataset.id],h=(n[0]+' '+n[4]+' '+n[7].join(' ')).toLowerCase();c.classList.toggle('hidden',!((F==='all'||n[2]===F)&&(!q||h.includes(q))));c.style.opacity='1'});path.classList.remove('show')}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');F=b.dataset.f;vis()});Q.oninput=vis;render();select('lumiere')})();
</script></body></html>
